<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
    {% block title %}극장의 소라고동{% endblock %}
    </title>
        <!--  파비콘 -->
     {% load static %}
    <link rel="icon" href="{% static 'img/logo.png' %}" type="image/png">
    <link rel="stylesheet" type="text/css" href="{% static 'css/home.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <style>
        /* 햄버거 메뉴로 변경되는 지점 768px*/
        nav {
            text-align: right;
            padding: 10px;
        }
        .navbar {
        background-color: #ffffff !important; /* 배경 색상을 흰색으로 설정 */
        }

        a.nav-linkactive {
            color: #C3ABE2;
        }

        .nav-link {
            position: relative; /* 밑줄을 추가하기 위해 position 설정 */
            text-decoration: none; /* 기본 텍스트 밑줄 제거 */
            transition: all 0.3s ease;
            line-height: 1.5; /* 기본 줄 높이 설정 */
            padding: 0;
            font-size: 16px; /* 텍스트 크기 명시적으로 설정 */
            color: black;
            display: inline-block;
            border-radius: 3px;
            background-color: #fff;
        }



        .nav-link:hover::after {
            content: ""; /* 가상 요소 생성 */
            position: absolute;
            bottom: -2px;
            left:0;
            width: 100%;
            height: 2.0px;
            background-color: #C3ABE2; /* 밑줄 색상 */
        }

        .nav-link.active {
            color: black; /* 활성화된 페이지의 글씨 색상 */
            background-color: #C3ABE2; /* 활성화된 링크의 배경색 */
            position: relative;
        }

        .nav-link.active::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #C3ABE2; /* 활성화된 링크의 밑줄 색 */
        }

        .nav-tabs .nav-item {
            margin-bottom: -10px;
            padding: 10px;

        }

        /* 기본 컨테이너 스타일 */
        .tabs-container {
            max-width: 800px;
            margin: 0 auto;
            font-family: Arial, sans-serif;
        }

        /* 탭 메뉴 스타일 */
        .nav-tabs {
            list-style: none;
            display: flex;

            margin: 0 !important;
            padding: 0 !important;
            border-bottom: 2px solid #ddd;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 15px 20px !important;
            cursor: pointer;
            font-size: 16px;
            color: #555;
            border: 3px solid #ddd;
            border-bottom: none;
            background: #f9f9f9;
            transition: background 0.3s, color 0.3s;
        }

        .tab-item:hover {
            background: #eee;
            color: #333;
        }

        .tab-item.active {
            background: #fff;
            color: #000;
            font-weight: bold;
            border-bottom: 2px solid #fff;
        }

        /* 탭 콘텐츠 스타일 */
        .tab-content {
            border: 2px solid #ddd;
            border-top: none;
            padding: 20px;
            background: #fff;
            animation: fadeIn 0.5s ease-in-out;

        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        /* 페이드 효과 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }


          /* play_nav */
        .play_nav {
            background-color: #ffffff !important; /* 배경 색상 설정 */
            padding: 10px 20px; /* 여백 설정 */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* 섬세한 그림자 */
        }

        .play_nav-item {
            display: inline-block;
            margin-right: 20px; /* 탭 간격 설정 */
        }

        .play_nav-link {
            text-decoration: none; /* 기본 텍스트 밑줄 제거 */
            font-size: 16px; /* 폰트 크기 */
            color: black; /* 기본 글씨 색상 */
            position: relative; /* 밑줄을 위한 포지션 설정 */
            padding: 10px 20px; /* 버튼 여백 */
            transition: all 0.3s ease; /* 부드러운 애니메이션 */
            display: inline-block;
        }

        .play_nav-link:hover {
            color: #f7f796; /* 마우스 호버 시 색상 */
        }

        .play_nav-link.active {
            color: #f7f796; /* 활성화된 링크 글씨 색 */
        }

        .play_nav-link.active::after {
            content: "";
            position: absolute;
            bottom: -3px; /* 밑줄 위치 */
            left: 0;
            width: 100%; /* 밑줄 너비 */
            height: 2px; /* 밑줄 두께 */
            background-color: #f7f796; /* 밑줄 색상 */
        }

        .play_nav-link:hover::after {
            content: "";
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #f7f796; /* 호버 시 밑줄 색상 */
        }




        body {
            background-color: #FFF;
        }
        .navbar-brand img {
            height: 60px;
            width:270px;

        }
        .navbar-brand {
            padding-top: 40px;
        }

        .navbar-brand img {
            height: 60px;
            width: 300px;
        }

        .navbar-toggler, #navbarNav {
            margin-bottom: 40px;
        }

    </style>
</head>
<body>
<header>
<!--   nav에서 검색 before_login에서 검색 기능 뺄 것 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{% if user.is_authenticated %}{% url 'home' %}{% else %}{% url 'before_login' %}{% endif %}">
                {% load static %}
                <img src="{% static 'images/conch_purple.png' %}" alt="극장의 소라고동">
            </a>
            <div class="section-header_search">
                {% if user.is_authenticated %}
                <div class="header-content">
    <!--            <img src="{% static 'images/ticket_white_.png' %}" alt="연극 포스터 1" style="height=150px; ">-->
                    <!--div class="search-box_home">
                        <input type="text" placeholder="공연/출연진 검색" class="search-input_home">
                        <button class="search-button_home">
                            <i class="fas fa-search"></i>
                        </button>
                    </div-->
                </div>
                {% endif %}
        </div>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link{% if request.path_info == '/accounts/profile/' %}active{% endif %}" href="{% url 'profile' %}">{{ user.username }}님</a>
                    </li>
                    <li>
                        <a class="nav-link{% if request.path == '/reviews/' %}active{% endif %}" href="{% url 'review' %}">후기 게시판</a>
                    </li>
                    <li>
                        <a class="nav-link{% if request.path == '/dashboard/dashboard/' %}active{% endif %}" href="{% url 'dashboard' %}">연극 돋보기</a>
                    </li>
                    <li>
                        <a class="nav-link{% if request.path == '/logout/' %}active{% endif %}" href="{% url 'logout' %}">로그아웃</a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link{% if request.path == '/accounts/login/' %}active{% endif %}" href="{% url 'login' %}">로그인</a>
                    </li>
                    <li>
                        <a class="nav-link{% if request.path == '/accounts/register/' %}active{% endif %}" href="{% url 'register' %}">회원가입</a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
</header>
{% block content %}
{% endblock %}
</body>
</html>
