{% block content %}
<style>
    /* 슬라이더 컨테이너 스타일 */
    .slider {
        position: relative;
        width: 100%;
        max-width: 1000px;
        margin: 20px auto;
        overflow: hidden;
        z-index: 1; /* 슬라이더의 z-index 낮추기 */
    }

    /* 슬라이더 내부의 슬라이드 컨테이너 스타일 */
    .slides {
        display: flex;
        transition: transform 0.5s ease-in-out;
    }

    /* 각 슬라이드의 기본 스타일 */
    .slide {
        min-width: 22%; /* 슬라이드 하나의 너비 설정 (한 번에 4개씩 표시) */
        box-sizing: border-box;
        text-align: center;
        position: relative;
        margin-right: 15px; /* 슬라이드 간 간격 */
        margin-left: 15px;
        transition: transform 0.3s ease-in-out;
    }

    /* 슬라이드 내부 이미지 스타일 */
    .slide img {
        width: 100%;
        height: 300px; /* 이미지 높이 고정 */
        border-radius: 10px; /* 테두리를 둥글게 설정 */
        object-fit: cover; /* 이미지가 박스 안에 비율에 맞게 채워짐 */
        transition: transform 0.3s ease-in-out;
    }

    /* 슬라이드 이미지에 마우스 오버 시 확대 효과 */
    .slide:hover img {
        transform: scale(1.05);
    }

    /* 슬라이드 정보 오버레이 스타일 */
    .slide .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5); /* 반투명 검정 배경 */
        color: white;
        opacity: 0; /* 기본적으로 숨김 */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 10px;
        font-size: 18px;
        transition: opacity 0.3s ease-in-out;
    }

    /* 슬라이드 오버레이에 마우스 오버 시 정보 표시 */
    .slide:hover .overlay {
        opacity: 1;
    }

    /* 슬라이드 순위 정보 표시 스타일 */
    .ranking-info {
        position: absolute;
        top: 10px;
        left: 10px;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 5px 10px;
        font-size: 18px;
        border-radius: 5px;
    }

    /* 슬라이더 네비게이션 버튼 스타일 */
    .slider-btn {
        position: absolute;
        text-align: center;
        top: 50%;
        transform: translateY(-50%);
        background-color: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        font-size: 18px;
        padding: 10px;
        cursor: pointer;
    }

    .prev-btn {
        left: -5px;
    }
    .next-btn {
        right: -5px;
    }

    /* 반응형 디자인: 화면이 768px 이하일 때 */
    @media (max-width: 768px) {
        .slide {
            min-width: 50%; /* 슬라이드 하나의 너비를 50%로 설정 (2개씩 표시) */
            margin-right: 25px;
        }

        h2 {
            font-size: 20px;
        }

        h4 {
            font-size: 16px;
        }
    }
</style>

<!-- 슬라이더 컨테이너 -->
<div class="slider">
    <!-- 슬라이더 내부 슬라이드 -->
    <div class="slides">
        <!-- ranked_data를 반복하여 슬라이드 생성 -->
        {% for play in ranked_data %}
        <div class="slide">
            <!-- 각 슬라이드의 이미지와 텍스트 -->
            <img src="{{ play.play_poster }}" alt="{{ play.play_name }}">
            <div class="overlay">
                <h5>{{ play.play_name }}</h5> <!-- 연극 이름 -->
                <p>{{ play.play_period }}</p> <!-- 공연 기간 -->
                <p>{{ play.theater_nm }}</p> <!-- 공연 극장 이름 -->

                 <!-- 공통 즐겨찾기 버튼 -->
                {% include "favorite_base.html" with object_id=play.id is_favorite=play.is_favorite %}
            </div>
            <div class="ranking-info">
                <span>{{ play.rank }}위</span> <!-- 순위 표시 -->

            </div>
        </div>
        {% endfor %}
    </div>

    <!-- 네비게이션 버튼 -->
    <button class="slider-btn prev-btn">&#10094;</button>
    <button class="slider-btn next-btn">&#10095;</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
    let currentSlide = 0; // 현재 슬라이드의 인덱스
    const slides = document.querySelector('.slides'); // 슬라이드 컨테이너
    const slideCount = document.querySelectorAll('.slide').length; // 슬라이드 총 개수
    let slidesToShow = 4; // 한 번에 표시할 슬라이드 개수
    let slideWidth = 100 / slidesToShow; // 각 슬라이드의 너비

    // 슬라이드를 업데이트하는 함수
    const updateSlide = () => {
        slides.style.transition = 'transform 0.5s ease-in-out'; // 부드러운 전환
        slides.style.transform = `translateX(-${currentSlide * slideWidth}%)`;
    };

    // 다음 슬라이드로 이동
    const nextSlide = () => {
        if (currentSlide + slidesToShow >= slideCount) {
            // 마지막 슬라이드를 지나면 첫 번째 슬라이드로 돌아가지만, 이때는 transition을 끄고 바로 이동
            slides.style.transition = 'none';
            currentSlide = 0;
            updateSlide();

            // 잠시 후 transition을 다시 활성화
            setTimeout(() => {
                slides.style.transition = 'transform 0.5s ease-in-out';
            }, 50); // 50ms 후에 transition을 다시 활성화
        } else {
            currentSlide += slidesToShow;
            updateSlide();
        }
    };

    // 이전 슬라이드로 이동
    const prevSlide = () => {
        if (currentSlide - slidesToShow < 0) {
            // 첫 번째 슬라이드를 지나면 마지막 슬라이드로 돌아감
            slides.style.transition = 'none';
            currentSlide = slideCount - slidesToShow;
            updateSlide();

            // 잠시 후 transition을 다시 활성화
            setTimeout(() => {
                slides.style.transition = 'transform 0.5s ease-in-out';
            }, 50);
        } else {
            currentSlide -= slidesToShow;
            updateSlide();
        }
    };

    // 네비게이션 버튼 이벤트 핸들러 추가
    document.querySelector('.next-btn').addEventListener('click', nextSlide);
    document.querySelector('.prev-btn').addEventListener('click', prevSlide);

    // 자동 슬라이드 (7초 간격)
    setInterval(nextSlide, 7000);

    // 창 크기 변화에 따른 슬라이드 개수 조정
    const adjustSlidesToShow = () => {
        if (window.innerWidth <= 768) {
            slidesToShow = 2; // 768px 이하에서는 2개씩 보이도록
        } else {
            slidesToShow = 4; // 그 이상에서는 4개씩 보이도록
        }
        slideWidth = 100 / slidesToShow; // 슬라이드 너비 계산
        updateSlide();
    };

    // 초기 슬라이드 설정 및 이벤트 리스너 추가
    adjustSlidesToShow();
    window.addEventListener('resize', adjustSlidesToShow);
});

</script>

{% endblock %}
