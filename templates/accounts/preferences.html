{% extends 'nav_base.html' %}
{% block title %}취향 설정{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h2 class="text-center">취향 설정</h2>
                </div>
                <div class="card-body">
                    <!-- 메시지 표시 섹션 추가 -->
                    {% if messages %}
                    <div class="messages">
                        {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}
                    <form method="POST" action="{% url 'preferences' %}">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="my_genre">장르 (복수 선택 가능)</label>
                            <select multiple class="form-control" id="my_genre" name="my_genre[]" required>
                                <option value="로맨스">로맨스</option>
                                <!-- 다른 옵션들 추가 -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="my_actor">좋아하는 배우</label>
                            <input type="text" class="form-control" id="my_actor" name="my_actor"
                                   placeholder="배우를 1명 입력하거나 없음을 입력하세요"
                                   value="{{ my_actor }}" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">회원가입 완료</button>
                    </form>
                    <!-- 로그인 버튼 추가 -->
                    <div class="mt-3 text-center">
                        <a href="{% url 'login' %}" class="btn btn-secondary">로그인</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
