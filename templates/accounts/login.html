{% extends 'nav_base.html' %}

{% block title %}로그인{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
        <div class="card-body">
            <h3 class="card-title text-center">로그인</h3>
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">사용자 ID</label>
                    <input type="text" class="form-control" name="username" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" class="form-control" name="password" id="password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="background-color: #dcb9ff; border-color: #dcb9ff; color: black;">로그인</button>
                <a href="{% url 'register' %}" class="btn btn-secondary btn-block mt-2"  style="background-color: #FBD568; border-color: #FBD568; color: black;">회원가입</a>
            </form>
        </div>
    </div>
</div>
{% include 'modal_base.html' %}
{% endblock %}

{% block styles %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Hahmlet:wght@100..900&family=Jua&family=Nanum+Gothic&family=Sunflower:wght@300&display=swap');

    body {
        background-color: #f8f9fa;
        font-family: 'Jua', sans-serif !important;
    }

    .login-text {
        font-family: 'Jua', sans-serif !important;
        font-weight: bold !important;
    }


    button, .btn {
        font-family: 'Jua', sans-serif !important;
        font-weight: bold !important;
    }


</style>
{% endblock %}
