<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    {% extends 'nav_base.html' %}
    {% block title %}회원가입 및 취향 설정{% endblock %}
</head>
<body>
    {% block content %}
    <title>회원정보 수정</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            width: 80%;
            max-width: 1200px;
            margin: 30px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 2em;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }

        input[type="submit"], button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        input[type="submit"]:hover, button:hover {
            background-color: #0056b3;
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .form-actions {
            text-align: center;
        }

        .form-actions a {
            text-decoration: none;
            color: #007bff;
        }

        .form-actions a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        // 취소 버튼 클릭 시 마이페이지로 이동하는 함수
        function cancelEdit() {
            window.location.href = "{% url 'profile' %}";
        }
    </script>

    <div class="container">
        <h1>회원정보 수정</h1>

        {% if messages %}
            <div>
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}  <!-- 폼 필드 출력 -->



            <div class="form-actions">
                <button type="submit" class="btn btn-primary">수정 완료</button>
                <a href="javascript:void(0);" onclick="cancelEdit()" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>

    <script>
        document.querySelector("form").onsubmit = function() {
            window.location.href = "{% url 'profile' %}";
        }
    </script>
    {% endblock %}
</body>
</html>
