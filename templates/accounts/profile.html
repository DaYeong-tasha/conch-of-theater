<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ user.fullname }}님의 마이페이지</title>
    <style>
        /* 탭 버튼 스타일링 */
        .tab-button {
            cursor: pointer;
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 5px;
            background-color: #f0f0f0;
        }

        .tab-button a {
            text-decoration: none;  /* 기본 밑줄 제거 */
            color: #333;            /* 글씨 색상 변경 */
        }

        .tab-button:hover {
            background-color: #ddd;
        }

        .tab-button a:hover {
            color: #000;           /* 마우스를 올렸을 때 글씨 색상 변경 */
        }

    </style>
</head>
<body>
     <h1>{{ user.fullname }}님의 마이페이지</h1>

    <!-- 탭 메뉴 -->
    <ul class="tabs">
        <li class="tab-button"><a href="{% url 'mypage_update' %}">회원정보수정</a></li>
        <li class="tab-button"><a href=>즐겨찾기(💗)</a></li>
        <li class="tab-button"><a href=>my리뷰(🎬)</a></li>
        <li class="tab-button"><a href=>my돋보기(🔍)</a></li>

    </ul>

</body>
</html>
