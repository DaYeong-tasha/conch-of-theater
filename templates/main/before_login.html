{% load static %}
<head>
    <title>{% block title %}로그인 전_극장의 소라고동{% endblock %}</title>
</head>

<!--파비콘-->
<link rel="icon" href="{% static 'images/logo02.png' %}" type="image/png" sizes="128x128">
<body>
{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Jua&display=swap');

    body {
        background: rgba(0, 0, 0, 0.0);
        width: 100%;
        background-image: url('/static/images/main_7777.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-color: transparent;
        transition: background-color 0.3s ease, color 0.3s ease;
        margin: 0;
    }

    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        flex-direction: column;
    }

    .mb-5 {
        margin-bottom: 3rem !important;
    }

    h2 {
        font-family: "Jua", sans-serif;
        font-size: 50px;
        color: black;
        transition: color 0.3s ease;
        margin-top: 0;
        font-weight: 400;
        margin-bottom: 10px;
    }

    h4 {
        font-family: Times New Roman;
        font-weight: lighter;
        font-style: oblique;
        color: black;
        transition: color 0.3s ease;
        font-size: 30px;
    }
    .close-btn {
        background-color: #304E70;
        color: white;
        padding: 8px 50px !important;
        border: none;
        cursor: pointer;
        position: relative; /* 버튼 클릭이 잘 되도록 설정 */
        z-index: 10000; /* 버튼이 제일 높게 */
        font-family: 'Jua', sans-serif;
        font-size: 17px;
    }

    /* 버튼 스타일 */
    .btn-outline-dark.custom-padding {
        font-family: 'Jua', sans-serif;
        font-size: 30px;
        padding: 15px 40px;
        background-color: #FBD568;
        color: white;
        border: 1px solid #fae7af; /* 테두리 추가 */
        border-radius: 30px;
        text-decoration: none; /* 밑줄 제거 */
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    /* 버튼 hover 효과 */
    .btn-outline-dark.custom-padding:hover {
        background-color: black;
        color: white;
        border-color: black; /* 테두리 색상 변경 */
    }


    /* 반응형 디자인 */
    @media (max-width: 768px) {
        h2 {
            font-size: 20px;
        }

        h4 {
            font-size: 16px;
        }

        .btn-outline-dark.custom-padding {
            font-size: 16px;
        }
    }
</style>

<div class="container">
    <!-- 텍스트 컨테이너 -->
    <div class="mb-5 n" id="text-container">
        <h2 class="mt-5">숏폼에 지친 당신에게<br>2시간의 여유를 선물합니다.</h2>
        <h4 class="mt-1">For you, take your own me time!</h4>
    </div>
    <!-- 추천 버튼 -->
    <div class="mb-5">
        <a href="{% url 'login' %}"
           class="btn btn-outline-dark btn-lg rounded-pill custom-padding"
           role="button"
           id="recommend-btn">
            나에게 맞는 연극 추천을 받아보세요!
        </a>
    </div>
</div>
{% include 'modal_base.html' %}

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const recommendBtn = document.getElementById('recommend-btn');
        const textContainer = document.getElementById('text-container');
        const body = document.body;

        // 기본 상태 설정
        body.style.backgroundColor = 'black'; // 기본 배경 검정
        textContainer.querySelector('h2').style.color = 'white'; // 기본 텍스트 흰색
        textContainer.querySelector('h4').style.color = 'white'; // 기본 텍스트 흰색

        // 마우스 hover 효과
        recommendBtn.addEventListener('mouseenter', function () {
            body.style.backgroundColor = 'white'; // 배경 흰색
            textContainer.querySelector('h2').style.color = 'black'; // 텍스트 검정색
            textContainer.querySelector('h4').style.color = 'black'; // 텍스트 검정색
        });

        // 마우스가 버튼에서 나갔을 때
        recommendBtn.addEventListener('mouseleave', function () {
            body.style.backgroundColor = 'black'; // 기본 배경 검정
            textContainer.querySelector('h2').style.color = 'white'; // 기본 텍스트 흰색
            textContainer.querySelector('h4').style.color = 'white'; // 기본 텍스트 흰색
        });
    });
</script>



{% endblock %}
</body>
