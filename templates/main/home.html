{% extends 'nav_base.html' %}
{% block title %}극장의 소라고동{% endblock %}
{% block content %}
<style>
  /* 필요하면 스타일 추가 */
</style>
<div class="container mt-5">
    <!-- Top 10 연극 Section -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>TOP 10 연극</h2>
        <div class="d-flex">
            <select class="form-select me-3" style="width: auto;">
                <option selected>전체순위별</option>
                <option value="1">인기순</option>
                <option value="2">최신순</option>
                <option value="3">평점순</option>
            </select>
            <div class="input-group">
                <input type="text" class="form-control" placeholder="공연/출연진 검색" aria-label="공연/출연진 검색">
                <button class="btn btn-outline-secondary" type="button">검색</button>
            </div>
        </div>
    </div>
    <!-- 연극 순위 -->
    {% include 'play_rank_base.html' %}

    <!-- Filter Buttons Section -->
    <h3 class="mb-3">카테고리</h3>
    <div class="btn-group flex-wrap mb-4">
        <button type="button" class="btn btn-outline-primary mb-2">전체</button>
        <button type="button" class="btn btn-outline-primary mb-2">공연예정</button>
        <button type="button" class="btn btn-outline-primary mb-2">공연중</button>
        <button type="button" class="btn btn-outline-primary mb-2">리미티드런</button>
        <button type="button" class="btn btn-outline-primary mb-2">마감임박</button>
    </div>

    <!-- 키워드/장르 추천 Section -->
    <h3 class="mb-3">키워드/장르 추천</h3>
    <div class="d-flex overflow-auto mb-4">
        <div class="card me-3" style="min-width: 150px;">
            {% load static %}
            <img src="{% static 'images/추천1.png' %}" class="card-img-top" alt="추천 1">
            <div class="card-body">
                <p class="card-title text-center">햄릿</p>
            </div>
        </div>
        <div class="card me-3" style="min-width: 150px;">
            <img src="{% static 'images/추천2.png' %}" class="card-img-top" alt="추천 2">
            <div class="card-body">
                <p class="card-title text-center">너를 데리러</p>
            </div>
        </div>
    </div>

    <!-- 현재 위치 주변 극장 Section -->
    <h3 class="mb-3">현재 위치 주변 극장</h3>
    <div id="map" class="mb-4" style="width: 100%; height: 300px; background-color: #f0f0f0;">
        <p class="text-center pt-5">지도 API 연동 예정</p>
    </div>
</div>

<!-- 모달을 포함 -->
{% include 'modal_base.html' %}

{% endblock %}
