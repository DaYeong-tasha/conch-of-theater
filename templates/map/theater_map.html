{% load static %}

<!-- 미니맵일 때는 필요한 부분만 표시 -->
{% if is_mini %}
  <div id="map" style="width: 100%; height: 100%;"></div>
    <!-- 미니맵 컨트롤 추가 -->
  <div class="map-controls">
    <button class="radius-btn active" data-radius="5000">5km</button>
    <button class="radius-btn" data-radius="10000">10km</button>
    <button class="radius-btn" data-radius="20000">20km</button>
  </div>
{% else %}
  <!-- 기존 전체 지도 레이아웃 -->
  <div class="container">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>공연장 지도</title>
          <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
          <link href="{% static 'css/theater_map.css' %}" rel="stylesheet">
      </head>
      <body>
          <div class="container">
              <div class="search-container">
                  <div class="search-box">
                      <input type="text" id="searchInput" class="search-input" placeholder="공연장 이름이나 주소를 입력하세요">
                      <button class="btn btn-search" onclick="theaterMap.searchPlace()">검색</button>
                  </div>
                  <div class="radius-selector">
                      <select id="radiusSelect" class="search-input">
                          <option value="1000">1km</option>
                          <option value="5000" selected>5km</option>
                          <option value="10000">10km</option>
                          <option value="20000">20km</option>
                      </select>
                      <button class="btn btn-location" onclick="theaterMap.filterTheatersByRadius()">현재 위치에서 검색</button>
                  </div>
              </div>

              <div class="utility-buttons">
                  <button class="btn btn-utility" onclick="theaterMap.getCurrentLocation()">
                      <i class="fas fa-crosshairs"></i> 내 위치로
                  </button>
                  <button class="btn btn-utility" onclick="theaterMap.showAllTheaters()">
                      <i class="fas fa-globe"></i> 전체보기
                  </button>
              </div>

              <div class="map-container">
                  <div id="map"></div>
              </div>

              <div class="list-container">
                  <div class="list-header">
                      <div class="list-title">공연장 목록</div>
                      <div class="list-filter">
                          <select id="sortSelect" onchange="theaterMap.sortTheaters(this.value)">
                              <option value="distance">거리순</option>
                              <option value="name">이름순</option>
                          </select>
                      </div>
                      <div>총 <span class="list-count" id="theaterCount">0</span>개의 공연장</div>
                  </div>
                  <ul class="theater-list" id="theaterList"></ul>
              </div>
          </div>

          <div id="loadingSpinner" class="loading-spinner">
              <div class="spinner"></div>
              <p>극장 정보를 불러오는 중...</p>
          </div>
      </body>
  </div>
{% endif %}

<!-- 카카오맵 API 스크립트 로드 전에 키를 먼저 설정 -->
<script type="text/javascript">
   console.log("API Key being used:", "{{ kakao_map_api_key }}");
</script>

<!-- 카카오맵 API 로드 -->
<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_map_api_key }}&libraries=services,clusterer,geometry"></script>
<script src="{% static 'js/theater_map.js' %}"></script>

<!-- 맵 초기화 -->
<script>
   document.addEventListener('DOMContentLoaded', function() {
       try {
           // 맵 컨테이너가 있는지 확인
           var mapContainer = document.getElementById('map');
           if (!mapContainer) {
               throw new Error('Map container not found');
           }
           console.log('Map container:', mapContainer);

           // 기본 맵 옵션
           var mapOption = {
               center: new kakao.maps.LatLng(37.566826, 126.9786567), // 서울 시청
               level: 3
           };

            var zoomControl = new kakao.maps.ZoomControl();
            map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

           // 맵 생성
           var map = new kakao.maps.Map(mapContainer, mapOption);
           console.log('Map created successfully');

           // 이후 theaters 데이터로 마커 생성
           var theaters = {{ theaters|safe }};
           console.log('Theaters data:', theaters);
           
           if (theaters && theaters.length > 0) {
               var theaterMap = new TheaterMap('map', theaters, {% if is_mini %}true{% else %}false{% endif %});
           } else {
               console.warn('No theaters data available');
           }
       } catch (error) {
           console.error('Error initializing map:', error);
       }
   });

  {% if not is_mini %}
  document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
          theaterMap.searchPlace();
      }
  });

  function closeInfoWindow(element) {
      element.parentElement.parentElement.parentElement.style.display = 'none';
  }
  {% endif %}
</script>
