<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Hahmlet:wght@100..900&family=Jua&family=Nanum+Gothic&family=Sunflower:wght@300&display=swap');

        /* 모달 유지 */
        .modal {
            display: none;
            position: fixed;
            z-index: 9990; /* 모달을 다른 요소들 위로 올리기 */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center; /* 가로 방향 중앙 정렬 */
            align-items: center; /* 세로 방향 중앙 정렬 */
            font-family: 'Jua', sans-serif;
            font-size: 19px;
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 40px 20px;
            width: 20%;
            border-radius: 10px;
            text-align: center;
            z-index: 9999; /* 모달 내용이 항상 위에 오도록 설정 */
            font-family: 'Jua', sans-serif;
        }

        .close-btn {
            /* background-color: #304E70; */
            background-color: rgba(48, 78, 112, 0.93); /* 95% 투명도 */
            color: white;
            padding: 8px 0px;
            border: none;
            cursor: pointer;
            position: relative; /* 버튼 클릭이 잘 되도록 설정 */
            z-index: 10000; /* 버튼이 제일 높게 */
            font-family: 'Jua', sans-serif;
            border-radius: 10px;
            margin: 0px 60px;
        }

        @media (max-width: 990px) {
        .modal-content {
            width: 30%;
        }
        }

        @media (max-width: 769px) {
        .close-btn {
            margin: 0px;
            }
        }

        @media (max-width: 390px) {
        .modal-content {
            width: 70%;
        }
        }
    </style>
</head>
<body>
<!-- modal_base.html -->
<div id="logoutModal" class="modal" style="display: {% if messages %}block{% else %}none{% endif %}; ">
    <div class="modal-content">
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
        <button id="closeModal" class="close-btn">확인</button>
    </div>
</div>

<script>
    var closeModal = document.getElementById('closeModal');
    var logoutModal = document.getElementById('logoutModal');

    // 모달의 배경을 클릭하면 모달 닫기
    logoutModal.onclick = function(event) {
        // 클릭된 영역이 모달 배경인지 확인
        if (event.target === logoutModal) {
            logoutModal.style.display = 'none';
        }
    };

    // 확인 버튼 클릭 시 모달 닫기
    closeModal.onclick = function() {
        logoutModal.style.display = 'none';
    }
</script>

</body>
</html>
